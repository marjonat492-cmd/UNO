<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174c3b" />
    <title>UNO - karta o'yini</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-2: #0f172a;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #f59e0b;
        --red: #ef4444;
        --yellow: #facc15;
        --green: #22c55e;
        --blue: #3b82f6;
        --card-back: #1e3a8a;
        --shadow: rgba(15, 23, 42, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #111827 35%, #1e293b);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      button {
        font: inherit;
      }

      .app-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .label {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-size: 0.7rem;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin-top: 6px;
      }

      .primary-btn,
      .deck-btn,
      .color-option {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }

      .primary-btn:hover,
      .deck-btn:hover,
      .color-option:hover,
      .card-btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      .primary-btn {
        background: var(--accent);
        color: #111827;
        font-weight: 700;
        padding: 12px 18px;
      }

      .game-area {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
      }

      .players-panel,
      .board-panel {
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 20px;
        box-shadow: 0 18px 40px var(--shadow);
      }

      .players-panel {
        padding: 18px;
      }

      .players-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 16px;
      }

      .player-item {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .player-item.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
      }

      .player-name {
        font-weight: 700;
        margin-bottom: 4px;
      }

      .player-count {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .board-panel {
        padding: 20px;
      }

      .table-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .discard-pile {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 120px;
        min-height: 170px;
        margin-top: 10px;
      }

      .deck-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .deck-btn {
        width: 88px;
        height: 120px;
        background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
        color: #fff;
        font-weight: 700;
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      #deck-count {
        font-weight: 700;
        font-size: 1.1rem;
      }

      .status-box {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--muted);
        margin-bottom: 22px;
      }

      .player-zone {
        margin-top: 10px;
      }

      .player-zone h2 {
        margin-bottom: 12px;
      }

      .hand-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        min-height: 160px;
      }

      .card-btn {
        position: relative;
        width: 90px;
        height: 130px;
        border: none;
        border-radius: 16px;
        color: #fff;
        font-size: 1.8rem;
        font-weight: 800;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
      }

      .card-btn.selectable {
        box-shadow:
          0 0 0 3px rgba(245, 158, 11, 0.7),
          0 12px 25px rgba(0, 0, 0, 0.25);
      }

      .card-btn[data-color="red"] {
        background: linear-gradient(135deg, #ef4444, #b91c1c);
      }
      .card-btn[data-color="yellow"] {
        background: linear-gradient(135deg, #facc15, #ca8a04);
        color: #111827;
      }
      .card-btn[data-color="green"] {
        background: linear-gradient(135deg, #22c55e, #15803d);
      }
      .card-btn[data-color="blue"] {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      }
      .card-btn[data-color="wild"] {
        background: linear-gradient(135deg, #111827, #374151);
      }

      .card-btn .card-value {
        display: inline-block;
        transform: scale(1.15);
      }

      .discard-card {
        width: 120px;
        height: 170px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        font-weight: 900;
        border: 3px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
      }

      .discard-card[data-color="red"] {
        background: linear-gradient(135deg, #ef4444, #b91c1c);
      }
      .discard-card[data-color="yellow"] {
        background: linear-gradient(135deg, #facc15, #ca8a04);
        color: #111827;
      }
      .discard-card[data-color="green"] {
        background: linear-gradient(135deg, #22c55e, #15803d);
      }
      .discard-card[data-color="blue"] {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      }
      .discard-card[data-color="wild"] {
        background: linear-gradient(135deg, #111827, #374151);
      }

      .color-picker {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(15, 23, 42, 0.7);
      }

      .color-picker.hidden {
        display: none;
      }

      .color-picker > div {
        background: #111827;
        border-radius: 20px;
        padding: 24px 28px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 22px 50px rgba(15, 23, 42, 0.45);
      }

      .color-picker h3 {
        margin-bottom: 16px;
        text-align: center;
      }

      .color-options {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .color-option {
        width: 110px;
        height: 52px;
        color: #fff;
        font-weight: 700;
      }

      .color-option.red {
        background: var(--red);
      }
      .color-option.yellow {
        background: var(--yellow);
        color: #111827;
      }
      .color-option.green {
        background: var(--green);
      }
      .color-option.blue {
        background: var(--blue);
      }

      @media (max-width: 800px) {
        .game-area {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .color-options {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="label">Karta o'yini</p>
          <h1>UNO</h1>
        </div>
        <button id="new-game" class="primary-btn">Yangi o'yin</button>
      </header>

      <main class="game-area">
        <aside class="players-panel">
          <h2>O'yinchilar</h2>
          <div id="players" class="players-list"></div>
        </aside>

        <section class="board-panel">
          <div class="table-header">
            <div>
              <p class="label">Stoldagi karta</p>
              <div id="discard-pile" class="discard-pile"></div>
            </div>
            <div class="deck-box">
              <p class="label">Dasta</p>
              <button
                id="draw-btn"
                class="deck-btn"
                aria-label="Dastadan karta olish"
              >
                Olish
              </button>
              <span id="deck-count">0</span>
            </div>
          </div>

          <div id="status" class="status-box" role="status" aria-live="polite">
            O'yin boshlanishga tayyor.
          </div>

          <div class="player-zone">
            <h2>Sizning kartalaringiz</h2>
            <div id="player-hand" class="hand-row"></div>
          </div>
        </section>
      </main>
    </div>

    <div
      id="color-picker"
      class="color-picker hidden"
      aria-label="Choose a color"
    >
      <div class="color-dialog">
        <h3>Rangni tanlang</h3>
        <div class="color-options">
          <button class="color-option red" data-color="red">Qizil</button>
          <button class="color-option yellow" data-color="yellow">Sariq</button>
          <button class="color-option green" data-color="green">Yashil</button>
          <button class="color-option blue" data-color="blue">Ko'k</button>
        </div>
      </div>
    </div>

    <script>
      const COLORS = ["red", "yellow", "green", "blue"];
      const ACTIONS = ["skip", "reverse", "draw2"];

      const state = {
        players: [],
        deck: [],
        discard: [],
        activePlayer: 0,
        direction: 1,
        currentColor: "red",
        currentValue: "0",
        winner: null,
        gameStarted: false,
      };

      function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function makeCard(color, value, type = "normal") {
        return {
          id: `${Date.now()}-${Math.random().toString(16).slice(2, 10)}`,
          color,
          value,
          type,
        };
      }

      function createDeck() {
        const deck = [];

        COLORS.forEach((color) => {
          deck.push(makeCard(color, "0", "number"));

          for (let value = 1; value <= 9; value += 1) {
            deck.push(makeCard(color, String(value), "number"));
            deck.push(makeCard(color, String(value), "number"));
          }

          ACTIONS.forEach((action) => {
            deck.push(makeCard(color, action, "action"));
            deck.push(makeCard(color, action, "action"));
          });
        });

        for (let i = 0; i < 4; i += 1) {
          deck.push(makeCard(null, "wild", "wild"));
          deck.push(makeCard(null, "wild4", "wild"));
        }

        return shuffle(deck);
      }

      function drawCardFromDeck() {
        if (state.deck.length === 0) {
          const last = state.discard.pop();
          const rest = state.discard;
          state.deck = shuffle(rest);
          state.discard = [last];
        }

        return state.deck.pop();
      }

      function getNextIndex(startIndex, steps = 1) {
        let index = startIndex;

        for (let i = 0; i < steps; i += 1) {
          index =
            (index + state.direction + state.players.length) %
            state.players.length;
        }

        return index;
      }

      function isPlayable(card) {
        if (!card) return false;
        if (card.color === "wild") return true;
        if (card.color === state.currentColor) return true;
        if (card.value === state.currentValue) return true;
        return false;
      }

      function cardLabel(card) {
        if (!card) return "";
        if (card.value === "wild") return "W";
        if (card.value === "wild4") return "+4";
        if (card.value === "draw2") return "+2";
        if (card.value === "reverse") return "↻";
        if (card.value === "skip") return "⊘";
        return card.value;
      }

      function setStatus(message) {
        const statusField = document.getElementById("status");
        statusField.textContent = message;
      }

      function renderPlayers() {
        const playersField = document.getElementById("players");
        playersField.innerHTML = "";

        state.players.forEach((player, index) => {
          const item = document.createElement("div");
          item.className = `player-item ${index === state.activePlayer ? "active" : ""}`;
          item.innerHTML = `
            <div class="player-name">${player.name}</div>
            <div class="player-count">${player.hand.length} ta karta</div>
          `;
          playersField.appendChild(item);
        });
      }

      function renderDiscard() {
        const discardField = document.getElementById("discard-pile");
        const topCard = state.discard[state.discard.length - 1];

        discardField.innerHTML = "";

        if (!topCard) {
          return;
        }

        const cardEl = document.createElement("div");
        cardEl.className = "discard-card";
        cardEl.dataset.color = topCard.color || "wild";
        cardEl.textContent = cardLabel(topCard);
        discardField.appendChild(cardEl);
      }

      function renderHand() {
        const handField = document.getElementById("player-hand");
        handField.innerHTML = "";

        if (!state.players[0]) {
          return;
        }

        state.players[0].hand.forEach((card, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `card-btn ${isPlayable(card) ? "selectable" : ""}`;
          btn.dataset.color = card.color || "wild";
          btn.textContent = cardLabel(card);
          btn.title = `${card.color || "wild"} ${card.value}`;

          if (state.activePlayer !== 0 || !state.gameStarted || state.winner) {
            btn.disabled = true;
          }

          btn.addEventListener("click", () => {
            if (state.activePlayer !== 0 || !state.gameStarted) return;
            if (!isPlayable(card)) return;

            if (card.value === "wild" || card.value === "wild4") {
              openColorPicker((chosenColor) => playCard(0, index, chosenColor));
            } else {
              playCard(0, index);
            }
          });

          handField.appendChild(btn);
        });
      }

      function renderGame() {
        renderPlayers();
        renderDiscard();
        renderHand();
        document.getElementById("deck-count").textContent = String(
          state.deck.length,
        );

        if (state.winner) {
          setStatus(`${state.winner} g'olib bo'ldi!`);
          return;
        }

        if (!state.gameStarted) {
          setStatus("Boshlash uchun 'Yangi o'yin' tugmasini bosing.");
          return;
        }

        if (state.activePlayer === 0) {
          setStatus(
            "Sizning navbatingiz. Rang yoki raqamni moslang, yoxud maxsus karta tashlang.",
          );
        } else {
          setStatus(`${state.players[state.activePlayer].name} o'ynamoqda...`);
        }
      }

      function playCard(playerIndex, handIndex, chosenColor = null) {
        const player = state.players[playerIndex];
        const card = player.hand.splice(handIndex, 1)[0];

        if (!card) {
          return;
        }

        state.discard.push(card);

        if (card.value === "wild" || card.value === "wild4") {
          state.currentColor = chosenColor || "red";
          state.currentValue = card.value;
        } else {
          state.currentColor = card.color;
          state.currentValue = card.value;
        }

        if (card.value === "reverse") {
          if (state.players.length === 2) {
            const skipTarget = getNextIndex(playerIndex, 2);
            state.activePlayer = skipTarget;
          } else {
            state.direction *= -1;
            state.activePlayer = getNextIndex(playerIndex, 1);
          }
        } else if (card.value === "skip") {
          state.activePlayer = getNextIndex(playerIndex, 2);
        } else if (card.value === "draw2") {
          const target = getNextIndex(playerIndex, 1);
          for (let i = 0; i < 2; i += 1) {
            state.players[target].hand.push(drawCardFromDeck());
          }
          state.activePlayer = getNextIndex(target, 1);
        } else if (card.value === "wild4") {
          const target = getNextIndex(playerIndex, 1);
          for (let i = 0; i < 4; i += 1) {
            state.players[target].hand.push(drawCardFromDeck());
          }
          state.activePlayer = getNextIndex(target, 1);
        } else {
          state.activePlayer = getNextIndex(playerIndex, 1);
        }

        if (player.hand.length === 0) {
          state.winner = player.name;
        }

        renderGame();

        if (state.winner) {
          return;
        }

        if (state.activePlayer !== 0) {
          setTimeout(cpuTurn, 650);
        }
      }

      function openColorPicker(callback) {
        const picker = document.getElementById("color-picker");
        picker.classList.remove("hidden");

        picker.querySelectorAll(".color-option").forEach((button) => {
          button.onclick = () => {
            picker.classList.add("hidden");
            callback(button.dataset.color);
          };
        });
      }

      function chooseCpuColor(cpu) {
        const counts = {
          red: 0,
          yellow: 0,
          green: 0,
          blue: 0,
        };

        cpu.hand.forEach((card) => {
          if (card.color && counts[card.color] !== undefined) {
            counts[card.color] += 1;
          }
        });

        const bestColor = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
        return bestColor ? bestColor[0] : "red";
      }

      function cpuTurn() {
        if (!state.gameStarted || state.winner || state.activePlayer === 0) {
          return;
        }

        const cpu = state.players[state.activePlayer];
        const playableCards = cpu.hand
          .map((card, index) => ({ card, index }))
          .filter(({ card }) => isPlayable(card));

        if (playableCards.length === 0) {
          cpu.hand.push(drawCardFromDeck());
          renderGame();

          const lastCard = cpu.hand[cpu.hand.length - 1];
          if (lastCard && isPlayable(lastCard)) {
            const lastIndex = cpu.hand.length - 1;
            const chosenColor =
              lastCard.color === "wild" || lastCard.value === "wild4"
                ? chooseCpuColor(cpu)
                : null;
            setTimeout(() => {
              if (lastCard.value === "wild" || lastCard.value === "wild4") {
                playCard(state.activePlayer, lastIndex, chosenColor);
              } else {
                playCard(state.activePlayer, lastIndex);
              }
            }, 400);
            return;
          }

          setTimeout(() => {
            state.activePlayer = getNextIndex(state.activePlayer, 1);
            renderGame();
            if (state.activePlayer !== 0) {
              cpuTurn();
            }
          }, 500);
          return;
        }

        const bestChoice =
          playableCards.find(
            ({ card }) =>
              card.value === "wild" ||
              card.value === "wild4" ||
              card.value === "draw2" ||
              card.value === "skip" ||
              card.value === "reverse",
          ) || playableCards[0];

        if (!bestChoice) {
          return;
        }

        const chosenColor =
          bestChoice.card.color === "wild" || bestChoice.card.value === "wild4"
            ? chooseCpuColor(cpu)
            : null;

        setTimeout(() => {
          playCard(state.activePlayer, bestChoice.index, chosenColor);
        }, 500);
      }

      function startGame() {
        const playerCount = 2;

        state.players = Array.from({ length: playerCount }, (_, index) => ({
          name: index === 0 ? "Siz" : "Kompyuter",
          hand: [],
        }));

        state.deck = createDeck();
        state.discard = [];
        state.activePlayer = 0;
        state.direction = 1;
        state.currentColor = "red";
        state.currentValue = "0";
        state.winner = null;
        state.gameStarted = true;

        state.players.forEach((player) => {
          for (let i = 0; i < 7; i += 1) {
            player.hand.push(drawCardFromDeck());
          }
        });

        let starter = drawCardFromDeck();
        while (
          starter &&
          (starter.color === null ||
            starter.value === "wild" ||
            starter.value === "wild4")
        ) {
          state.deck.unshift(starter);
          starter = drawCardFromDeck();
        }

        if (starter) {
          state.discard.push(starter);
          state.currentColor = starter.color;
          state.currentValue = starter.value;
        }

        renderGame();

        if (state.activePlayer !== 0) {
          cpuTurn();
        }
      }

      document.getElementById("new-game").addEventListener("click", startGame);
      document.getElementById("draw-btn").addEventListener("click", () => {
        if (!state.gameStarted || state.activePlayer !== 0 || state.winner) {
          return;
        }

        const drawn = drawCardFromDeck();
        state.players[0].hand.push(drawn);
        renderGame();

        if (drawn && isPlayable(drawn)) {
          setStatus(
            "Tashlash mumkin bo'lgan karta oldingiz. Uni qo'lingizdan tanlang.",
          );
        } else {
          state.activePlayer = getNextIndex(state.activePlayer, 1);
          renderGame();
          if (state.activePlayer !== 0) {
            setTimeout(cpuTurn, 600);
          }
        }
      });
    </script>
  </body>
</html>
